[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    payments: payment flow and payment operation tests
    tasks: task creation, update, and auto-creation tests
    vendors: vendor categorization and management tests
    queries: budget queries, complex queries, data retrieval tests
    subevents: sub-event CRUD tests
    deletes: delete confirmation and execution tests
    context: conversation context preservation tests
    feedback: feedback system tests
    errors: edge cases and API error handling tests
    dashboard: dashboard stats and relationship integrity tests
    attachments: attachment upload, download, and management tests
    fast: tests that do not call the LLM (run in seconds)
    extraction: extraction service internal method tests
